<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDeal India - Best Shopping Deals</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #102243;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

nav {
    background: #174c75;
    padding: 14px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 35px 15px;
    background: #dceeff;
}

.search {
    width: 90%;
    max-width: 450px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 15px;
    padding: 18px;
    max-width: 1100px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 2px 9px #0001;
}

.card img {
    width: 100%;
    height: 145px;
    object-fit: contain;
}

.card h3 {
    font-size: 16px;
}

.price {
    color: #087b3d;
    font-size: 19px;
    font-weight: bold;
}

.btn {
    display: block;
    width: 100%;
    background: #ff8c00;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    background: #102243;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 25px;
}
</style>
</head>

<body>

<header>
<h1>🛍️ SmartDeal India</h1>
<p>Best Deals | Best Products | Smart Shopping</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#about">About</a>
</nav>

<div class="hero" id="home">
<h2>Welcome to SmartDeal India!</h2>
<p>Find Your Favourite Products at Great Prices!</p>

<input
class="search"
id="search"
type="text"
placeholder="🔍 Search Products..."
oninput="searchProducts()"
>
</div>

<h2 style="text-align:center" id="products">
🔥 Our Products
</h2>

<div class="products" id="productList"></div>

<footer id="about">
<h2>SmartDeal India</h2>
<p>Thank You For Shopping With Us!</p>
<p>© 2026 SmartDeal India</p>
</footer>

<script>

const defaultProducts = [
{
name: "Samsung Smartphone",
price: 9999,
image: "https://images.unsplash.com/photo-1511707171634-5f897ff02a29?w=400"
},
{
name: "Wireless Headphones",
price: 1499,
image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
},
{
name: "Smart Watch",
price: 1999,
image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
},
{
name: "Sports Shoes",
price: 1299,
image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
},
{
name: "Stylish T-Shirt",
price: 499,
image: "https://images.unsplash.com/photo-1521572163474-686419cf17ab?w=400"
}
];

function getProducts() {
    let saved = JSON.parse(
        localStorage.getItem("adminProducts") || "[]"
    );

    return [...defaultProducts, ...saved];
}

function showProducts(items = getProducts()) {

    const list = document.getElementById("productList");

    list.innerHTML = "";

    items.forEach(product => {

        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = product.image || "https://placehold.co/250x180?text=Product";
        img.alt = product.name;
        img.onerror = function() {
            this.src = "https://placehold.co/250x180?text=Product";
        };

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + product.price;

        const button = document.createElement("button");
        button.className = "btn";
        button.textContent = "Buy Now";

        button.onclick = function() {
            alert(
                product.name +
                " - ₹" + product.price +
                "\nThank you for choosing SmartDeal India!"
            );
        };

        card.append(img, name, price, button);

        list.appendChild(card);

    });

}

function searchProducts() {

    const search = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = getProducts().filter(product =>
        product.name.toLowerCase().includes(search)
    );

    showProducts(filtered);

}

window.addEventListener("storage", function(event) {
    if (event.key === "adminProducts") {
        searchProducts();
    }
});

showProducts();

</script>

</body>
</html>
