<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDeal India - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #e65c00;
      margin-top: 5px;
    }

    h2 {
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      margin: 5px 3px;
    }

    .add-btn {
      width: 100%;
      background: #e65c00;
      color: white;
      font-weight: bold;
      margin-top: 12px;
    }

    .edit-btn {
      background: #1677d2;
      color: white;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 15px;
      border-radius: 9px;
      background: #fff;
    }

    .product img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      display: block;
      margin-bottom: 10px;
    }

    .buy-amazon {
      background: #ff9900;
      color: #111;
    }

    .buy-flipkart {
      background: #2874f0;
      color: white;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .note {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SmartDeal India</h1>
    <h2>Admin Panel</h2>

    <form id="productForm">

      <input
        type="text"
        id="productName"
        placeholder="Product Name"
        required
      >

      <input
        type="number"
        id="productPrice"
        placeholder="Product Price (₹)"
        min="0"
        step="0.01"
        required
      >

      <input
        type="url"
        id="productImage"
        placeholder="Product Image URL"
        required
      >

      <input
        type="url"
        id="amazonLink"
        placeholder="Amazon Affiliate Link (Optional)"
      >

      <input
        type="url"
        id="flipkartLink"
        placeholder="Flipkart Affiliate Link (Optional)"
      >

      <button type="submit" class="add-btn" id="submitBtn">
        Add Product
      </button>

      <button
        type="button"
        id="cancelEditBtn"
        class="delete-btn"
        style="display:none; width:100%;"
      >
        Cancel Edit
      </button>

    </form>

    <p class="note">
      Note: અહીં તમારે તમારા પોતાના Affiliate Links નાખવાના છે.
    </p>

    <h2>Products List</h2>

    <div id="productsList"></div>

  </div>

  <script>
    const STORAGE_KEY = "smartdealIndiaProducts";

    let products = [];

    try {
      products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      if (!Array.isArray(products)) products = [];
    } catch (error) {
      products = [];
    }

    let editingId = null;

    const form = document.getElementById("productForm");
    const productsList = document.getElementById("productsList");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");

    const nameInput = document.getElementById("productName");
    const priceInput = document.getElementById("productPrice");
    const imageInput = document.getElementById("productImage");
    const amazonInput = document.getElementById("amazonLink");
    const flipkartInput = document.getElementById("flipkartLink");

    function saveProducts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (error) {}
      return "";
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderProducts() {
      productsList.innerHTML = "";

      if (products.length === 0) {
        productsList.appendChild(
          makeElement("p", "empty", "No products added yet.")
        );
        return;
      }

      products.forEach(function(product) {
        const card = makeElement("div", "product");

        const imageUrl = safeUrl(product.image);

        if (imageUrl) {
          const image = document.createElement("img");
          image.src = imageUrl;
          image.alt = product.name || "Product";
          image.loading = "lazy";
          image.onerror = function() {
            image.style.display = "none";
          };
          card.appendChild(image);
        }

        card.appendChild(
          makeElement("h3", "", product.name)
        );

        card.appendChild(
          makeElement("p", "", "Price: ₹" + product.price)
        );

        if (safeUrl(product.amazon)) {
          const amazonButton = makeElement(
            "button",
            "buy-amazon",
            "Buy on Amazon"
          );
          amazonButton.type = "button";
          amazonButton.addEventListener("click", function() {
            window.open(safeUrl(product.amazon), "_blank", "noopener");
          });
          card.appendChild(amazonButton);
        }

        if (safeUrl(product.flipkart)) {
          const flipkartButton = makeElement(
            "button",
            "buy-flipkart",
            "Buy on Flipkart"
          );
          flipkartButton.type = "button";
          flipkartButton.addEventListener("click", function() {
            window.open(safeUrl(product.flipkart), "_blank", "noopener");
          });
          card.appendChild(flipkartButton);
        }

        const editButton = makeElement(
          "button",
          "edit-btn",
          "Edit"
        );
        editButton.type = "button";
        editButton.addEventListener("click", function() {
          editProduct(product.id);
        });
        card.appendChild(editButton);

        const deleteButton = makeElement(
          "button",
          "delete-btn",
          "Delete"
        );
        deleteButton.type = "button";
        deleteButton.addEventListener("click", function() {
          deleteProduct(product.id);
        });
        card.appendChild(deleteButton);

        productsList.appendChild(card);
      });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const price = Number(priceInput.value);
      const image = safeUrl(imageInput.value.trim());
      const amazon = amazonInput.value.trim()
        ? safeUrl(amazonInput.value.trim())
        : "";
      const flipkart = flipkartInput.value.trim()
        ? safeUrl(flipkartInput.value.trim())
        : "";

      if (!name || !Number.isFinite(price) || price < 0 || !image) {
        alert("Please enter a valid product name, price and image URL.");
        return;
      }

      if (amazonInput.value.trim() && !amazon) {
        alert("Please enter a valid Amazon link.");
        return;
      }

      if (flipkartInput.value.trim() && !flipkart) {
        alert("Please enter a valid Flipkart link.");
        return;
      }

      if (!amazon && !flipkart) {
        alert("Please enter at least one affiliate link.");
        return;
      }

      if (editingId !== null) {
        const index = products.findIndex(
          item => item.id === editingId
        );

        if (index !== -1) {
          products[index] = {
            id: editingId,
            name: name,
            price: price,
            image: image,
            amazon: amazon,
            flipkart: flipkart
          };
        }
      } else {
        products.push({
          id: Date.now().toString(),
          name: name,
          price: price,
          image: image,
          amazon: amazon,
          flipkart: flipkart
        });
      }

      saveProducts();
      resetForm();
      renderProducts();

      alert("Product saved successfully!");
    });

    function editProduct(id) {
      const product = products.find(item => item.id === id);
      if (!product) return;

      editingId = id;

      nameInput.value = product.name;
      priceInput.value = product.price;
      imageInput.value = product.image;
      amazonInput.value = product.amazon || "";
      flipkartInput.value = product.flipkart || "";

      submitBtn.textContent = "Update Product";
      cancelEditBtn.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function deleteProduct(id) {
      if (!confirm("Are you sure you want to delete this product?")) {
        return;
      }

      products = products.filter(item => item.id !== id);

      saveProducts();
      renderProducts();

      if (editingId === id) {
        resetForm();
      }
    }

    function resetForm() {
      form.reset();
      editingId = null;
      submitBtn.textContent = "Add Product";
      cancelEditBtn.style.display = "none";
    }

    cancelEditBtn.addEventListener("click", resetForm);

    renderProducts();
  </script>

</body>
</html>
