<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartDeal India Admin</title>
<style>
body{font-family:Arial;background:#f1f4f9;margin:0;padding:20px}
h1{text-align:center;color:#102243}
.box{background:white;padding:18px;margin:15px auto;max-width:500px;border-radius:12px;box-shadow:0 2px 8px #ccc}
input{width:95%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:6px}
button{padding:12px;background:#ff8c00;color:white;border:0;border-radius:6px;font-weight:bold}
.product{padding:12px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<h1>SmartDeal India Admin</h1>

<div class="box">
<h2>Add New Product</h2>
<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Product Price">
<input id="image" placeholder="Product Image URL">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="box">
<h2>Products List</h2>
<div id="list"></div>
</div>

<script>
let products=JSON.parse(localStorage.getItem("adminProducts")||"[]");

function showProducts(){
let list=document.getElementById("list");
list.innerHTML="";
products.forEach((p,i)=>{
list.innerHTML+=`
<div class="product">
<b>${p.name}</b> - ₹${p.price}<br>
<button onclick="deleteProduct(${i})">Delete</button>
</div>`;
});
}

function addProduct(){
let name=document.getElementById("name").value.trim();
let price=document.getElementById("price").value;
let image=document.getElementById("image").value.trim();
if(!name||!price){alert("Enter product name and price");return;}
products.push({name,price,image});
localStorage.setItem("adminProducts",JSON.stringify(products));
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("image").value="";
showProducts();
alert("Product Added!");
}

function deleteProduct(i){
if(confirm("Delete this product?")){
products.splice(i,1);
localStorage.setItem("adminProducts",JSON.stringify(products));
showProducts();
}
}
showProducts();
</script>

</body>
</html>
