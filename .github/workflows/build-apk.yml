name: Build SmartDeal India APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "app.html"
      - "orders.html"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/in/smartdealindia/launcher
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SmartDealIndia"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'in.smartdealindia.launcher'
              compileSdk 35
              defaultConfig {
                  applicationId 'in.smartdealindia.launcher'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="SmartDeal India" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/in/smartdealindia/launcher/MainActivity.java <<'EOF'
          package in.smartdealindia.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("https://smartdeal-india-six.vercel.app/app.html");
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
      - name: Create colorful PK app icon
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cat > /tmp/make_icon.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          stops=[(0,(0,190,255)),(.28,(60,70,255)),(.55,(190,35,220)),(.78,(255,75,110)),(1,(255,175,35))]
          for density,size in sizes.items():
              pix=Image.new('RGB',(size,size))
              p=pix.load()
              for y in range(size):
                  for x in range(size):
                      t=(x+y)/(2*(size-1))
                      for j in range(len(stops)-1):
                          if stops[j][0]<=t<=stops[j+1][0]:
                              t0,c0=stops[j];t1,c1=stops[j+1];f=(t-t0)/(t1-t0)
                              p[x,y]=tuple(int(c0[k]*(1-f)+c1[k]*f) for k in range(3));break
              mask=Image.new('L',(size,size),0)
              ImageDraw.Draw(mask).rounded_rectangle((1,1,size-2,size-2),radius=int(size*.23),fill=255)
              pix.putalpha(mask)
              d=ImageDraw.Draw(pix)
              d.ellipse((int(size*.62),int(-size*.18),int(size*1.12),int(size*.32)),fill=(255,255,255,35))
              d.rounded_rectangle((int(size*.055),int(size*.055),int(size*.945),int(size*.945)),radius=int(size*.21),outline=(255,255,255,220),width=max(1,size//28))
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.43))
              box=d.textbbox((0,0),'PK',font=font,stroke_width=max(1,size//70))
              x=(size-(box[2]-box[0]))/2-box[0];y=(size-(box[3]-box[1]))/2-box[1]-int(size*.015)
              d.text((x+size*.012,y+size*.018),'PK',font=font,fill=(25,20,70,180),stroke_width=max(1,size//45),stroke_fill=(25,20,70,180))
              d.text((x,y),'PK',font=font,fill=(255,255,255,255),stroke_width=max(1,size//70),stroke_fill=(255,220,70,255))
              pix.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY
          python3 /tmp/make_icon.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDeal-India-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
