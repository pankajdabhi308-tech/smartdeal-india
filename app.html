<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101d38">
  <meta name="description" content="SmartDeal India private launcher">
  <link rel="manifest" href="/app.webmanifest">
  <link rel="icon" href="/smartdeal-app-icon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SmartDeal India</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#101d38,#173d68);font-family:Arial,sans-serif;color:#fff}
    main{width:min(100%,430px);text-align:center}
    .logo{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:#fff;display:grid;place-items:center;color:#101d38;font-size:32px;font-weight:900;box-shadow:0 12px 30px #0003}
    h1{font-size:27px;margin:0 0 8px}
    .sub{margin:0 0 30px;color:#d7e4f5;font-size:15px}
    .launch{display:flex;align-items:center;gap:16px;width:100%;padding:19px;margin:13px 0;border:1px solid #ffffff35;border-radius:17px;background:#fff;color:#13233d;text-decoration:none;text-align:left;box-shadow:0 8px 22px #0002}
    .symbol{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:#eaf1ff;display:grid;place-items:center;font-size:24px}
    .label{font-size:18px;font-weight:700;display:block}
    .hint{font-size:13px;color:#64748b;display:block;margin-top:5px}
    .arrow{margin-left:auto;font-size:24px;color:#2874f0}
    footer{margin-top:28px;color:#c5d4e7;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="logo">SD</div>
    <h1>SmartDeal India</h1>
    <p class="sub">તમારી પોતાની વેબસાઇટ માટેનું શોર્ટકટ એપ</p>
    <a class="launch" href="/admin.html">
      <span class="symbol">⚙️</span>
      <span><span class="label">Admin Panel</span><span class="hint">પ્રોડક્ટ ઉમેરો અને મેનેજ કરો</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="launch" href="/">
      <span class="symbol">🌐</span>
      <span><span class="label">My Website</span><span class="hint">SmartDeal India ખોલો</span></span>
      <span class="arrow">›</span>
    </a>
    <footer>Private launcher · Internet connection required</footer>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/app-sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
